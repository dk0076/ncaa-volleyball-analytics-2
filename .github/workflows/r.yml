# Syntax-checks the committed R source.
#
# The pipeline itself cannot run in CI: the dataset is not in the repo (see
# .gitignore), and script 01 pulls ~45-60 minutes of live NCAA play-by-play
# data. So this verifies what can honestly be verified without the data —
# that every script, the Shiny app, and every knitr chunk parses.
#
# This replaces GitHub's default R-package template, which assumed a
# DESCRIPTION file and ran R CMD check. This repository is a script
# collection, not an R package, so that template could never pass.

name: R

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install knitr
        run: install.packages("knitr")
        shell: Rscript {0}

      - name: Parse all R scripts, the Shiny app, and Rmd chunks
        run: Rscript .github/scripts/parse-check.R
